<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        display: block;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-family: sans-serif;
        font-size: 24px;
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="overlay">Нажмите в любом месте, чтобы продолжить</div>

    <video id="player" playsinline loop autoplay muted></video>

    <script>
      // Карта коротких ключей (можно менять ключи на любые короткие слова/цифры)
      const videoMap = {
        star: "All-Star-Opening.mp4",
        fenix: "BEARWOLF-ФЕНИКС.mp4",
        ben: "ben.mp4",
        defo: "defo.mp4",
        derevnya: "derevnya.mp4",
        hey: "HEYYEYAAEYAAAEYAEYAA.mp4",
        like: "I-Like-To.mp4",
        meow: "Never-gonna-Meow.mp4",
        rick: "Rick-Astley.mp4",
        timati: "timati.mp4",
      };

      const player = document.getElementById("player");
      const overlay = document.getElementById("overlay");

      // Получаем параметр v из URL
      const urlParams = new URLSearchParams(window.location.search);
      const key = urlParams.get("v");

      let targetVideo = null;

      // Если ключ передан и есть в словаре
      if (key && videoMap[key]) {
        targetVideo = videoMap[key];
      } else {
        // Рандомный выбор, если ключ не передан или не существует
        const keys = Object.keys(videoMap);
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        targetVideo = videoMap[randomKey];
      }

      // Загружаем видео из папки videos
      player.src = `videos/${targetVideo}`;

      player.play().catch(() => {});

      overlay.addEventListener("click", () => {
        player.muted = false;
        player.play();
        overlay.style.display = "none";
      });
    </script>
  </body>
</html>
